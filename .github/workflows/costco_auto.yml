name: Costco Auto Pipeline

# 觸發條件設定
on:
  schedule:
    - cron: '58 2 * * 2,6'  # UTC 02:58 = 台北時間 10:58（週二/週六），提早 2 分鐘啟動當緩衝

  # 允許手動點擊按鈕觸發
  workflow_dispatch:

# 執行任務定義
jobs:
  run-pipeline:
    # 指定雲端主機作業系統（最新版 Ubuntu，內建 Chrome 瀏覽器）
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 避免 Selenium 卡住時無限占用 Actions 額度

    steps:
      # 步驟 1：檢出 (Checkout) 儲存庫的程式碼至虛擬機器
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 步驟 2：在虛擬機器上安裝 Python 環境
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # 快取 pip 依賴，大幅加速後續執行

      # 步驟 3：安裝專案所需依賴套件
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 步驟 4：安裝並固定 Chrome 瀏覽器版本
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 步驟 5：把 Google Vision 服務帳號金鑰從 Secrets 寫成實體檔案
      - name: Write Google Vision Credentials
        run: echo '${{ secrets.GOOGLE_VISION_CREDENTIALS_JSON }}' > ${{ github.workspace }}/gcp-credentials.json

      # 步驟 6：執行完整流程（爬蟲 -> 正規化I -> OCR -> 正規化II），一次跑完不再分階段
      - name: Run Full Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-credentials.json
        run: |
          python main.py

      # 步驟 7：不論成功或失敗，都把最終產出跟 log 存成 Artifact 方便追查
      - name: Upload Pipeline Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            final_output.csv
            daybuy_scraper.log
          if-no-files-found: warn
          retention-days: 14
